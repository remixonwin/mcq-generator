name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend build & e2e
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend/react-ui
        run: npm ci
      - name: Build UI
        working-directory: frontend/react-ui
        run: npm run build
      - name: Install playwright browsers
        working-directory: frontend/react-ui
        run: npx playwright install --with-deps
      - name: Run e2e tests
        working-directory: frontend/react-ui
        run: |
          PORT=3000 npm run test -- --project=chromium --reporter=list

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t mcq-generator-api .
      - name: Build frontend image
        run: docker build -t mcq-generator-frontend frontend/react-ui
