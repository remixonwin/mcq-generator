services:
  api:
    build: .
    command: ./scripts/run_api.sh --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      - PROVIDER_URL=${PROVIDER_URL:-http://provider:7330}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  # Single‑page React frontend
  frontend:
    # build uses the Dockerfile inside frontend/react-ui
    build:
      context: ./frontend/react-ui
      dockerfile: Dockerfile
    ports:
      - "3001:80"           # host port 3001 -> container nginx
    depends_on:
      - api
    # optional: mount source for dev convenience
    volumes:
      - ./frontend/react-ui:/app
    # use same network as api by default
