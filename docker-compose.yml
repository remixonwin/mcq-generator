version: '3.8'

services:
  # Main MCQ Generator API - Instance 1 (Port 7560)
  mcq-generator-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcq-generator-api-7560
    ports:
      - "7560:7560"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:7560,http://localhost:7561,http://localhost:7562
      - API_PORT=7560
      - INSTANCE_ID=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcq-network

  # MCQ Generator API - Instance 2 (Port 7561)
  mcq-generator-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcq-generator-api-7561
    ports:
      - "7561:7560"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:7560,http://localhost:7561,http://localhost:7562
      - API_PORT=7561
      - INSTANCE_ID=2
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcq-network
    profiles:
      - multi-instance

  # MCQ Generator API - Instance 3 (Port 7562)
  mcq-generator-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcq-generator-api-7562
    ports:
      - "7562:7560"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:7560,http://localhost:7561,http://localhost:7562
      - API_PORT=7562
      - INSTANCE_ID=3
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcq-network
    profiles:
      - multi-instance

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcq-generator-worker
    command: celery -A mcq_generator.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcq-network
    healthcheck:
      test: ["CMD", "celery", "-A", "mcq_generator.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: mcq-generator-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mcq-network

  # Redis Commander (optional - for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mcq-generator-redis-ui
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mcq-network
    profiles:
      - tools

volumes:
  redis_data:
    driver: local

networks:
  mcq-network:
    driver: bridge
